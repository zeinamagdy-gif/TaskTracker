<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Task Tracker</title>
  <desc id="d">A command-line task tracker written in Python that saves tasks to a JSON file.</desc>

  <rect width="900" height="500" rx="16" fill="#EEF2F6"/>

  <!-- Left column -->
  <text x="40" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#14213D">Task Tracker</text>
  <text x="40" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">A command-line to-do app written in Python.</text>
  <text x="40" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Your tasks are saved to a JSON file.</text>

  <!-- Status pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="166" width="64" height="26" rx="13" fill="#E2E8F0"/>
    <text x="72" y="184" fill="#475569">todo</text>
    <rect x="112" y="166" width="112" height="26" rx="13" fill="#FDE9C8"/>
    <text x="168" y="184" fill="#92400E">in-progress</text>
    <rect x="232" y="166" width="66" height="26" rx="13" fill="#D1F0DC"/>
    <text x="265" y="184" fill="#166534">done</text>
  </g>

  <!-- Features -->
  <text x="40" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14213D">Features</text>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#334155">
    <circle cx="46" cy="278" r="3.5" fill="#94A3B8"/>
    <text x="60" y="283">Add tasks with an automatic id</text>
    <circle cx="46" cy="306" r="3.5" fill="#D97706"/>
    <text x="60" y="311">Update a task to todo, in-progress, or done</text>
    <circle cx="46" cy="334" r="3.5" fill="#94A3B8"/>
    <text x="60" y="339">Delete tasks you no longer need</text>
    <circle cx="46" cy="362" r="3.5" fill="#15803D"/>
    <text x="60" y="367">Saves to test.json and reloads on start</text>
  </g>

  <!-- Run -->
  <text x="40" y="410" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14213D">Run it</text>
  <rect x="40" y="424" width="250" height="36" rx="8" fill="#14213D"/>
  <text x="56" y="447" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#F1F5F9">python main.py</text>
  <text x="310" y="447" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Python 3.7+</text>

  <!-- Terminal -->
  <rect x="410" y="40" width="450" height="420" rx="12" fill="#14213D"/>
  <circle cx="434" cy="62" r="6" fill="#94A3B8"/>
  <circle cx="454" cy="62" r="6" fill="#D97706"/>
  <circle cx="474" cy="62" r="6" fill="#4ADE80"/>

  <g font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1" xml:space="preserve">
    <text x="430" y="104" fill="#F1F5F9">$ python main.py</text>
    <text x="430" y="132">What is your name: <tspan fill="#F1F5F9">Alex</tspan></text>
    <text x="430" y="160" fill="#94A3B8">1) Add  2) Update  3) Delete  4) Show  5) Quit</text>

    <text x="430" y="188">choose number: <tspan fill="#F1F5F9">1</tspan></text>
    <text x="430" y="210">Description: <tspan fill="#F1F5F9">cleaning</tspan></text>
    <text x="430" y="232">Added: Task:1 Description: cleaning - status: <tspan fill="#94A3B8">todo</tspan></text>

    <text x="430" y="270">choose number: <tspan fill="#F1F5F9">2</tspan></text>
    <text x="430" y="292">Enter id number: <tspan fill="#F1F5F9">1</tspan></text>
    <text x="430" y="314">New status (todo/in-progress/done): <tspan fill="#F1F5F9">done</tspan></text>

    <text x="430" y="352">choose number: <tspan fill="#F1F5F9">4</tspan></text>
    <text x="430" y="374">Task:1 Description: cleaning - status: <tspan fill="#4ADE80">done</tspan></text>

    <text x="430" y="412">choose number: <tspan fill="#F1F5F9">5</tspan></text>
    <text x="430" y="434">bye bye</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
